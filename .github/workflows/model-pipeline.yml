name: Model Pipeline CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'ml/**'
      - '.github/workflows/model-pipeline.yml'
  workflow_dispatch:

jobs:
  validate-model:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy onnx onnxruntime pillow

      - name: Validate Model Registry Integrity
        run: |
          python -c "
          import json, os
          labels_path = 'ml/model_registry/class_labels.json'
          assert os.path.exists(labels_path), 'class_labels.json missing!'
          with open(labels_path, 'r') as f:
              data = json.load(f)
          print(f'Verified {len(data)} classes in label registry.')
          assert len(data) == 38, f'Expected 38 classes, found {len(data)}'
          "

      - name: Test Model Inference Smoke Check
        run: |
          python -c "
          import onnxruntime as ort
          import numpy as np
          import os

          model_path = 'ml/model_registry/mobilenet_v2_v1.onnx'
          if os.path.exists(model_path):
              session = ort.InferenceSession(model_path, providers=['CPUExecutionProvider'])
              input_name = session.get_inputs()[0].name
              dummy_input = np.random.randn(1, 3, 224, 224).astype(np.float32)
              outputs = session.run(None, {input_name: dummy_input})
              print('Model output shape:', outputs[0].shape)
              assert outputs[0].shape[1] == 38, 'Model output classes mismatch!'
              print('Model validation passed successfully.')
          else:
              print('Model weights not found; smoke test skipped.')
          "
