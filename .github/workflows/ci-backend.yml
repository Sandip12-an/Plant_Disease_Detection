name: Backend CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 backend/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Backend Unit Tests
        env:
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: "ci-secret-key-for-testing"
          MODEL_PATH: "ml/model_registry/mobilenet_v2_v1.onnx"
          CLASS_LABELS_PATH: "ml/model_registry/class_labels.json"
          DISEASE_DATA_PATH: "backend/app/db/seed_data/diseases_data.json"
        run: |
          pytest backend/tests -v --tb=short
