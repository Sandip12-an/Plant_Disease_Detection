version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: plant_disease_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: plant_disease_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plant_disease_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plant_disease_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/plant_disease_db
      - SECRET_KEY=development-insecure-secret-key-change-in-prod
      - MODEL_PATH=/app/ml/model_registry/mobilenet_v2_v1.onnx
      - CLASS_LABELS_PATH=/app/ml/model_registry/class_labels.json
      - DISEASE_DATA_PATH=/app/app/db/seed_data/diseases_data.json
      - UPLOAD_DIR=/app/uploads
      - BACKEND_CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./ml/model_registry:/app/ml/model_registry

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plant_disease_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
