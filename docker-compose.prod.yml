version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: plant_disease_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changethisinproduction}
      POSTGRES_DB: ${POSTGRES_DB:-plant_disease_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plant_disease_backend_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changethisinproduction}@postgres:5432/${POSTGRES_DB:-plant_disease_db}
      - SECRET_KEY=${SECRET_KEY}
      - MODEL_PATH=/app/ml/model_registry/mobilenet_v2_v1.onnx
      - CLASS_LABELS_PATH=/app/ml/model_registry/class_labels.json
      - DISEASE_DATA_PATH=/app/app/db/seed_data/diseases_data.json
      - UPLOAD_DIR=/app/uploads
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
    volumes:
      - uploads_data:/app/uploads
      - ./ml/model_registry:/app/ml/model_registry:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plant_disease_frontend_prod
    restart: always
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: plant_disease_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data_prod:
  uploads_data:
